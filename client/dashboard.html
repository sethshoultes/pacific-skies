<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard — Pacific Skies</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<nav class="top"></nav>
<main>
  <div style="width:600px;max-width:100%">
    <h2 style="color:var(--accent)">Squadron Record</h2>
    <div id="guest-msg" class="muted"></div>
    <div class="grid">
      <div class="panel">
        <h3>Stats</h3>
        <table class="data" id="stats-table"></table>
      </div>
      <div class="panel">
        <h3>Achievements</h3>
        <div id="ach-list"></div>
      </div>
    </div>
    <div class="panel" style="margin-top:12px">
      <h3>Recent runs</h3>
      <table class="data" id="runs-table"><thead><tr><th>Score</th><th>Stage reached</th><th>Kills</th><th>Time</th><th>Mode</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="panel" style="margin-top:12px">
      <h3>Leaderboard</h3>
      <table class="data" id="lb-table"><thead><tr><th>#</th><th>Callsign</th><th>Score</th><th>Stage</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</main>
<script type="module" src="/dashboard.js"></script>
</body>
</html>
