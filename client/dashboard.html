<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard — Pacific Skies</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%231b3a5c%27/%3E%3Cpath d=%27M7 1h2v5l6 3v2l-6-1v3l2 1v1H5v-1l2-1V10L1 11V9l6-3z%27 fill=%27%23e8e0c0%27/%3E%3C/svg%3E" />
<meta name="theme-color" content="#06090f" />
<link rel="manifest" href="/manifest.json" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<nav class="top"></nav>
<main>
  <div style="width:600px;max-width:100%">
    <h2 style="color:var(--accent)">Squadron Record</h2>
    <div id="guest-msg" class="muted"></div>
    <div class="grid">
      <div class="panel">
        <h3>Stats</h3>
        <table class="data" id="stats-table"></table>
      </div>
      <div class="panel">
        <h3>Achievements</h3>
        <div id="ach-list"></div>
      </div>
    </div>
    <div class="panel" style="margin-top:12px">
      <h3>Recent runs</h3>
      <table class="data" id="runs-table"><thead><tr><th>Score</th><th>Stages cleared</th><th>Kills</th><th>Time</th><th>Mode</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="panel" style="margin-top:12px">
      <h3>Leaderboard</h3>
      <table class="data" id="lb-table"><thead><tr><th>#</th><th>Callsign</th><th>Score</th><th>Stages cleared</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</main>
<script type="module" src="/dashboard.js"></script>
</body>
</html>
