<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Pacific Skies</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%231b3a5c%27/%3E%3Cpath d=%27M7 1h2v5l6 3v2l-6-1v3l2 1v1H5v-1l2-1V10L1 11V9l6-3z%27 fill=%27%23e8e0c0%27/%3E%3C/svg%3E" />
<meta name="theme-color" content="#06090f" />
<link rel="manifest" href="/manifest.json" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<nav class="top"></nav>
<main>
  <div id="stage">

    <section id="title" class="screen on">
      <h1>PACIFIC SKIES</h1>
      <div class="sub">A tribute to the 1984 arcade vertical scroller genre</div>
      <canvas id="attract" width="384" height="360"></canvas>
      <div class="sub blink" id="coin-prompt">PRESS START — INSERT COIN</div>
      <div class="row">
        <label style="margin:0">Callsign</label>
        <input id="gname" maxlength="12" placeholder="Guest" />
      </div>
      <div class="row">
        <button class="primary" id="quick">Quick Play</button>
        <button id="create">Create Room</button>
        <button id="join-link">Join via link</button>
      </div>
      <div class="sub" id="hiscore"></div>
      <div class="sub controls-hint">WASD / arrows to fly · Space to fire · Shift or Q to loop · M to mute</div>
    </section>

    <section id="roomscreen" class="screen">
      <div class="panel">
        <div class="row" style="justify-content:space-between">
          <b id="rs-name">Room</b>
          <span class="muted" id="rs-id"></span>
        </div>
        <p class="muted" style="font-size:12px">Invite link: <a id="rs-link" href="#"></a></p>
        <div id="rs-roster"></div>
        <div class="row" style="margin-top:12px;justify-content:space-between">
          <button id="rs-ready">Ready</button>
          <span id="rs-countdown" class="muted"></span>
          <button class="primary" id="rs-start">Start</button>
        </div>
        <p id="rs-hint" class="muted" style="font-size:11px;margin:6px 0 0"></p>
        <div class="row" style="margin-top:8px">
          <input id="rs-chat" placeholder="Say something..." style="flex:1" />
        </div>
        <div id="rs-chatlog" class="muted" style="font-size:11px;max-height:80px;overflow:auto;margin-top:6px"></div>
      </div>
    </section>

    <section id="game" class="screen">
      <div id="hud">
        <span>STAGE <b id="hud-stage">32</b> <span id="hud-stagename" class="muted"></span></span>
        <span class="lives">LIVES <b id="hud-lives">3</b></span>
        <span class="loops">LOOPS <b id="hud-loops">3</b></span>
        <span class="score">SCORE <b id="hud-score">0</b></span>
      </div>
      <canvas id="view" width="384" height="576"></canvas>
      <div id="touch-controls" hidden aria-label="Touch controls">
        <div class="tc-stick" id="tc-stick" aria-label="Joystick"><div class="tc-knob" id="tc-knob"></div></div>
        <div class="tc-buttons">
          <button class="tc-btn tc-loop" id="tc-loop" type="button">LOOP</button>
          <button class="tc-btn tc-fire" id="tc-fire" type="button">FIRE</button>
        </div>
      </div>
      <p class="touch-hint muted">Left pad flies · hold FIRE · tap LOOP to dodge · or drag anywhere on the sky</p>
    </section>

  </div>
</main>
<script type="module" src="/game.js"></script>
</body>
</html>
